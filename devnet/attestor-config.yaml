---
# Attestor configuration for the exSat source chain.
#
# The secret is read from the environment, not stored here. Generate one and
# export it before starting the attestor:
#
#   export ATTESTOR_SECRET=0x$(openssl rand -hex 32)
#
# (A key that lives in a public repository is not a key. The one that used to
# be inlined here has been discarded.)
attestor:
  name: "Bitcoin Witness Attestor"
  # Assigned by bootstrap-devnet.mjs when it registers exSat on a fresh chain.
  # Re-run that script after `docker compose down -v` and put the key it prints
  # here. The attestation genesis it picks sits ~200 blocks below exSat's head at
  # registration time: the genesis is immutable once the chain has attestation
  # history, and starting from a stale height means grinding through hundreds of
  # thousands of blocks at ~230 blocks/min before reaching anything useful.
  chain_key: 7                 # assigned by register_chain, NOT the EVM chainId
  secret: "${ATTESTOR_SECRET}"

api:
  port: 9100

eth:
  # Was "wss://evm.exsat.network/" -- now routed through the local shim, which
  # relays everything verbatim but repairs exSat's always-zero `receiptsRoot`
  # header field for transaction-bearing blocks. See the exsat-shim service in
  # docker-compose.yaml (and exsat-shim/server.mjs) for the full rationale.
  url: "ws://exsat-shim:8546"

cc3:
  url: "ws://cc3:9944"  # docker-compose service name, not localhost -- attestor runs in its own container
