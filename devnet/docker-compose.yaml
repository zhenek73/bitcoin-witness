# Local Creditcoin (CC3) devnet for Bitcoin Witness.
#
# Why a devnet at all: Attestcoin only attests source chains that have been
# registered on-chain via `register_chain`, and that extrinsic is gated by the
# Operators origin. Creditcoin's public network has Ethereum, Sepolia, Polygon
# Amoy and some local test chains registered — not exSat. Running our own CC3
# instance makes us the operator of that instance, so we can register exSat and
# point attestors at it. This is the real Creditcoin protocol, not a stand-in.
---
services:
  cc3:
    container_name: bw-cc3-devnet
    image: gluwa/creditcoin3
    entrypoint: /bin/creditcoin3-node
    command:
      - --dev
      - --validator
      - --pruning
      - archive
      - --unsafe-rpc-external
      - --rpc-cors
      - all
    ports:
      - "9944:9944"

  # exSat's EVM layer never populates `receiptsRoot` / `stateRoot` in its block
  # headers -- every block reports 32 zero bytes for both, whether or not it has
  # transactions (verified across many consecutive blocks on evm.exsat.network).
  # The attestor recomputes the receipts root from the block's own receipts and
  # compares it to the header; for an EMPTY block it skips that comparison, but
  # for any block WITH a transaction the computed root is a real non-zero hash
  # that can never equal exSat's constant zero -- so the attestor rejects it as
  # a "possible reorg", retries forever, and never advances past the first
  # transaction-bearing block. This shim sits between the two: it relays every
  # JSON-RPC message verbatim except that, for blocks that do contain
  # transactions, it fills in the zeroed `receiptsRoot` with the root computed
  # from that block's own real receipts. Nothing else is altered -- block hash,
  # transactions and transactionsRoot (which is genuine and canonical on exSat,
  # independently verified, and is what the inclusion proofs are actually built
  # on) all pass through untouched.
  exsat-shim:
    container_name: bw-exsat-shim
    build: ./exsat-shim
    restart: unless-stopped
    ports:
      - "8546:8546"

  # Attestors are a separate binary in the same image (/usr/bin/attestor),
  # not a distinct image -- this service was referenced by name in the
  # README ("docker compose up -d attestor") but never actually defined here.
  # ATTESTOR_SECRET must be exported in the shell before `docker compose up`;
  # it is never written into this file or the image. Put it in devnet/.env
  # instead (gitignored) so `docker compose up` picks it up automatically --
  # exporting it by hand in a fresh shell is easy to forget and the container
  # fails loudly with "invalid mnemonic or hex seed" if it's missing.
  attestor:
    container_name: bw-cc3-attestor
    image: gluwa/creditcoin3
    entrypoint: /usr/bin/attestor
    command:
      - --config
      - /config/attestor-config.yaml
    environment:
      - ATTESTOR_SECRET
    volumes:
      - ./attestor-config.yaml:/config/attestor-config.yaml:ro
    depends_on:
      - cc3
      - exsat-shim

  # See attestor2-config.yaml: gossipsub cannot publish to a topic with no other
  # subscriber, so a lone attestor queues every vote forever with
  # NoPeersSubscribedToTopic. This second process runs the SAME attestor identity
  # purely to be that subscriber. It is gossip-layer infrastructure, not a second
  # validator — a distinct account cannot reach the topic at all (it would have
  # to be elected first, and an unelected account can never publish its BLS key).
  attestor2:
    container_name: bw-cc3-attestor2
    image: gluwa/creditcoin3
    entrypoint: /usr/bin/attestor
    command:
      - --config
      - /config/attestor2-config.yaml
    environment:
      # attestor 2's own distinct key (a distinct libp2p peer id is the point),
      # remapped onto the fixed name the binary expands inside its config.
      - ATTESTOR_SECRET=${ATTESTOR2_SECRET}
    volumes:
      - ./attestor2-config.yaml:/config/attestor2-config.yaml:ro
    depends_on:
      - cc3
      - exsat-shim

  # Also a separate binary in the same image (/usr/bin/proof-gen-api-server).
  # Generates the inclusion + continuity proofs demo.ts/prove_fact.ts submit
  # to BitcoinFactVerifier.proveBitcoinFact. Needs a YAML config (chain_key
  # isn't settable via CLI flags -- the only CLI mode hardcodes chain_key=2)
  # plus --cc3-rpc-url on the command line, since that one flag is
  # deliberately NOT read from the YAML (CLI/env only, per --help).
  proofgen:
    container_name: bw-cc3-proofgen
    image: gluwa/creditcoin3
    entrypoint: /usr/bin/proof-gen-api-server
    command:
      - --cc3-rpc-url
      - ws://cc3:9944
      - --config
      - /config/proofgen-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./proofgen-config.yaml:/config/proofgen-config.yaml:ro
    depends_on:
      - cc3
      - exsat-shim
