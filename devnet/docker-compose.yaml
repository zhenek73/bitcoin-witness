# Local Creditcoin (CC3) devnet for Bitcoin Witness.
#
# Why a devnet at all: Attestcoin only attests source chains that have been
# registered on-chain via `register_chain`, and that extrinsic is gated by the
# Operators origin. Creditcoin's public network has Ethereum, Sepolia, Polygon
# Amoy and some local test chains registered — not exSat. Running our own CC3
# instance makes us the operator of that instance, so we can register exSat and
# point attestors at it. This is the real Creditcoin protocol, not a stand-in.
---
services:
  cc3:
    container_name: bw-cc3-devnet
    image: gluwa/creditcoin3
    entrypoint: /bin/creditcoin3-node
    command:
      - --dev
      - --validator
      - --pruning
      - archive
      - --unsafe-rpc-external
      - --rpc-cors
      - all
    ports:
      - "9944:9944"

  # Attestors are a separate binary in the same image (/usr/bin/attestor),
  # not a distinct image -- this service was referenced by name in the
  # README ("docker compose up -d attestor") but never actually defined here.
  # ATTESTOR_SECRET must be exported in the shell before `docker compose up`;
  # it is never written into this file or the image. Put it in devnet/.env
  # instead (gitignored) so `docker compose up` picks it up automatically --
  # exporting it by hand in a fresh shell is easy to forget and the container
  # fails loudly with "invalid mnemonic or hex seed" if it's missing.
  attestor:
    container_name: bw-cc3-attestor
    image: gluwa/creditcoin3
    entrypoint: /usr/bin/attestor
    command:
      - --config
      - /config/attestor-config.yaml
    environment:
      - ATTESTOR_SECRET
    volumes:
      - ./attestor-config.yaml:/config/attestor-config.yaml:ro
    depends_on:
      - cc3

  # Also a separate binary in the same image (/usr/bin/proof-gen-api-server).
  # Generates the inclusion + continuity proofs demo.ts/prove_fact.ts submit
  # to BitcoinFactVerifier.proveBitcoinFact. Needs a YAML config (chain_key
  # isn't settable via CLI flags -- the only CLI mode hardcodes chain_key=2)
  # plus --cc3-rpc-url on the command line, since that one flag is
  # deliberately NOT read from the YAML (CLI/env only, per --help).
  proofgen:
    container_name: bw-cc3-proofgen
    image: gluwa/creditcoin3
    entrypoint: /usr/bin/proof-gen-api-server
    command:
      - --cc3-rpc-url
      - ws://cc3:9944
      - --config
      - /config/proofgen-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./proofgen-config.yaml:/config/proofgen-config.yaml:ro
    depends_on:
      - cc3
