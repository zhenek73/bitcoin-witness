<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitcoin Witness</title>
  <!--
    GitHub Pages can only serve a branch from its root or from /docs, and the

    repository URL and the demo URL are the same thing.

  <link rel="canonical" href="./ui/" />
  <meta http-equiv="refresh" content="0; url=./ui/" />
  <style>
    html, body { margin: 0; padding: 0; background: #090b0f; color: #e7e9ee;
      font: 15px/1.6 Manrope, system-ui, -apple-system, sans-serif; }
    main { max-width: 40ch; margin: 22vh auto 0; padding: 0 22px; }
    a { color: #ffb020; }
  </style>
</head>
<body>
  <main>
    <p>The Witness Trail is at <a href="./ui/">/ui/</a>.</p>
  </main>
  <script>location.replace("./ui/");</script>
</body>
</html>
